<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="docGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f7fafc;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="256" height="256" rx="48" fill="url(#bgGradient)"/>
  
  <!-- Main document stack (3 layers for multiple profiles) -->
  <rect x="88" y="68" width="100" height="120" rx="6" fill="#4a5568" opacity="0.3"/>
  <rect x="82" y="62" width="100" height="120" rx="6" fill="#4a5568" opacity="0.5"/>
  <rect x="76" y="56" width="100" height="120" rx="6" fill="url(#docGradient)" stroke="#4a5568" stroke-width="2"/>
  
  <!-- Hosts file icon - stylized "H" made of connected nodes -->
  <circle cx="90" cy="90" r="8" fill="#667eea"/>
  <circle cx="90" cy="140" r="8" fill="#667eea"/>
  <circle cx="162" cy="90" r="8" fill="#667eea"/>
  <circle cx="162" cy="140" r="8" fill="#667eea"/>
  
  <!-- Connecting lines forming "H" -->
  <line x1="90" y1="98" x2="90" y2="132" stroke="#667eea" stroke-width="5" stroke-linecap="round"/>
  <line x1="162" y1="98" x2="162" y2="132" stroke="#667eea" stroke-width="5" stroke-linecap="round"/>
  <line x1="98" y1="115" x2="154" y2="115" stroke="#667eea" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Toggle/switch indicator (represents activate/deactivate) -->
  <rect x="100" y="172" width="56" height="24" rx="12" fill="#48bb78" stroke="#38a169" stroke-width="2"/>
  <circle cx="144" cy="184" r="10" fill="#ffffff"/>
  
  <!-- Subtle network dots pattern in background -->
  <circle cx="40" cy="40" r="3" fill="#ffffff" opacity="0.2"/>
  <circle cx="216" cy="40" r="3" fill="#ffffff" opacity="0.2"/>
  <circle cx="40" cy="216" r="3" fill="#ffffff" opacity="0.2"/>
  <circle cx="216" cy="216" r="3" fill="#ffffff" opacity="0.2"/>
</svg>
